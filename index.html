<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PY Worksheets</title>

<style>
:root{
  --blue:#0799c9;
  --blue-dark:#007da8;
  --blue-light:#dff4fb;
  --line:#0a9bcb;
  --text:#12323f;
  --bg:#f7f9fb;
  --white:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(90deg,#087aa5,#0aa3d3,#087aa5);
  color:white;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.topbar{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:center;
  padding:0 16px;
}

.level-btn{
  flex:1;
  max-width:360px;
  border:0;
  background:transparent;
  color:white;
  font-size:24px;
  font-weight:700;
  padding:17px 18px;
  cursor:pointer;
  border-bottom:4px solid transparent;
}

.level-btn:hover,
.level-btn.active{
  background:rgba(255,255,255,.12);
  border-bottom-color:white;
}

.wrap{
  max-width:1200px;
  margin:28px auto 60px;
  padding:0 18px;
}

.hero{
  text-align:center;
  padding:18px 18px 22px;
  margin-bottom:20px;
  border-radius:18px;
  background:linear-gradient(135deg,#eaf7ff 0%,#ffffff 48%,#fff3d8 100%);
  box-shadow:0 5px 16px rgba(0,125,168,.10);
}

.py-logo{
  display:block;
  width:190px;
  max-width:60%;
  margin:0 auto 6px;
  border-radius:10px;
}

.hero h1{
  margin:0;
  color:#073b73;
  font-size:38px;
  letter-spacing:.3px;
}

.hero p{
  margin:8px 0 0;
  color:#5f6c72;
  font-size:18px;
}

.section-nav{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:26px;
}

.section-btn{
  border:2px solid var(--blue);
  background:white;
  color:var(--blue-dark);
  padding:12px 27px;
  font-size:18px;
  font-weight:700;
  border-radius:8px;
  cursor:pointer;
}

.section-btn:hover,
.section-btn.active{
  background:var(--blue);
  color:white;
}


.subcategory-nav{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin:-10px 0 24px;
  padding:12px 14px;
  background:#eaf7fc;
  border-left:5px solid var(--blue);
  border-radius:7px;
}

.topic-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.subcategory-label{
  font-weight:700;
  color:var(--blue-dark);
  margin-right:4px;
}

.subcategory-btn{
  border:1px solid var(--blue);
  background:white;
  color:var(--blue-dark);
  padding:8px 14px;
  font-size:14px;
  font-weight:700;
  border-radius:6px;
  cursor:pointer;
}

.subcategory-btn:hover,
.subcategory-btn.active{
  background:var(--blue-dark);
  color:white;
}

.controls{
  display:grid;
  grid-template-columns:minmax(260px,1fr) auto;
  gap:22px;
  align-items:end;
  margin-bottom:16px;
}

.search-box input{
  width:100%;
  border:2px solid var(--blue);
  padding:16px 18px;
  font-size:18px;
  outline:none;
  border-radius:6px;
  background:white;
}

.grade-title{
  font-weight:700;
  color:var(--blue-dark);
  margin-bottom:8px;
  font-size:18px;
}

.grade-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.grade-btn{
  min-width:44px;
  height:44px;
  border:0;
  border-radius:5px;
  background:var(--blue);
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.grade-btn.active{
  background:#064c66;
}

.status{
  margin:12px 0;
  color:#65747b;
  font-size:14px;
}

.error{
  background:#fff4f4;
  border:1px solid #e2a6a6;
  color:#8b1d1d;
  padding:14px 16px;
  border-radius:7px;
  margin-bottom:16px;
  line-height:1.45;
}

.hidden{display:none!important}

.table-card{
  background:white;
  border:1px solid #cfd8dc;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

thead th{
  background:var(--blue);
  color:white;
  padding:14px 8px;
  font-size:18px;
  border-right:1px solid rgba(255,255,255,.35);
}

tbody td{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:11px 9px;
  text-align:center;
  vertical-align:middle;
  font-size:16px;
}

tbody tr:nth-child(even){background:#eef9fd}
tbody tr:hover{background:#dff4fb}

.topic{
  text-align:left;
  font-weight:700;
  color:var(--blue-dark);
}

.resource-name{text-align:left}

.pdf-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:9px 12px;
  border-radius:6px;
  background:#df171f;
  color:white;
  text-decoration:none;
  font-weight:700;
  min-width:95px;
}

.pdf-link:hover{filter:brightness(.92)}
.answer-link{background:#087da8}

.grade-pill{
  display:inline-block;
  min-width:44px;
  padding:7px 9px;
  border:2px solid #222;
  background:#f6f6f6;
  color:#111;
  font-weight:800;
  font-size:20px;
}

.empty{
  padding:38px 18px;
  text-align:center;
  color:#66757c;
  font-size:18px;
}

.footer{
  text-align:center;
  color:#87949a;
  font-size:13px;
  margin-top:26px;
}

@media (max-width:800px){
  .controls{grid-template-columns:1fr}
  .table-card{overflow-x:auto}
  table{min-width:720px;table-layout:auto}
  .level-btn{font-size:20px}
}

@media (max-width:520px){
  .wrap{padding:0 10px;margin-top:18px}
  .hero h1{font-size:27px}
  .section-btn{flex:1;min-width:120px;padding:10px 12px;font-size:15px}
}

.section-btn[data-section="All"]{border-color:#22577a;color:#22577a}
.section-btn[data-section="Number"]{border-color:#e83e5b;color:#c92544}
.section-btn[data-section="Algebra"]{border-color:#1684d5;color:#0b6fb8}
.section-btn[data-section="Shape"]{border-color:#38a65a;color:#287f43}
.section-btn[data-section="Data"]{border-color:#f39a24;color:#c97700}

.section-btn[data-section="All"].active,
.section-btn[data-section="All"]:hover{background:#22577a;color:white}
.section-btn[data-section="Number"].active,
.section-btn[data-section="Number"]:hover{background:#e83e5b;color:white}
.section-btn[data-section="Algebra"].active,
.section-btn[data-section="Algebra"]:hover{background:#1684d5;color:white}
.section-btn[data-section="Shape"].active,
.section-btn[data-section="Shape"]:hover{background:#38a65a;color:white}
.section-btn[data-section="Data"].active,
.section-btn[data-section="Data"]:hover{background:#f39a24;color:white}


.table-card{
  border-radius:12px;
}

thead th{
  background:linear-gradient(90deg,#078fbe,#11a7d6);
}

body{
  background:
    radial-gradient(circle at top left, rgba(17,167,214,.08), transparent 28%),
    radial-gradient(circle at top right, rgba(243,154,36,.08), transparent 25%),
    var(--bg);
}


#topicNav[data-section="Number"]{background:#fff0f3;border-left-color:#e83e5b}
#topicNav[data-section="Number"] .subcategory-btn{border-color:#ef90a0;color:#b92542}
#topicNav[data-section="Number"] .subcategory-btn:hover,
#topicNav[data-section="Number"] .subcategory-btn.active{background:#e83e5b;color:white}

#topicNav[data-section="Algebra"]{background:#edf7ff;border-left-color:#1684d5}
#topicNav[data-section="Algebra"] .subcategory-btn{border-color:#7bbcf0;color:#0b6fb8}
#topicNav[data-section="Algebra"] .subcategory-btn:hover,
#topicNav[data-section="Algebra"] .subcategory-btn.active{background:#1684d5;color:white}

#topicNav[data-section="Shape"]{background:#effaf2;border-left-color:#38a65a}
#topicNav[data-section="Shape"] .subcategory-btn{border-color:#83cc98;color:#287f43}
#topicNav[data-section="Shape"] .subcategory-btn:hover,
#topicNav[data-section="Shape"] .subcategory-btn.active{background:#38a65a;color:white}

#topicNav[data-section="Data"]{background:#fff6e9;border-left-color:#f39a24}
#topicNav[data-section="Data"] .subcategory-btn{border-color:#f2b25c;color:#bd6b00}
#topicNav[data-section="Data"] .subcategory-btn:hover,
#topicNav[data-section="Data"] .subcategory-btn.active{background:#f39a24;color:white}


/* A-Level main section colours */
.section-btn[data-section="Pure"]{border-color:#7b52c8;color:#6841b0}
.section-btn[data-section="Statistics"]{border-color:#13a89e;color:#087e77}
.section-btn[data-section="Mechanics"]{border-color:#e06f2a;color:#b95518}

.section-btn[data-section="Pure"].active,
.section-btn[data-section="Pure"]:hover{background:#7b52c8;color:white}
.section-btn[data-section="Statistics"].active,
.section-btn[data-section="Statistics"]:hover{background:#13a89e;color:white}
.section-btn[data-section="Mechanics"].active,
.section-btn[data-section="Mechanics"]:hover{background:#e06f2a;color:white}

#topicNav[data-section="Pure"]{background:#f5f0ff;border-left-color:#7b52c8}
#topicNav[data-section="Pure"] .subcategory-btn{border-color:#b7a0e4;color:#6841b0}
#topicNav[data-section="Pure"] .subcategory-btn:hover,
#topicNav[data-section="Pure"] .subcategory-btn.active{background:#7b52c8;color:white}

#topicNav[data-section="Statistics"]{background:#ebfaf8;border-left-color:#13a89e}
#topicNav[data-section="Statistics"] .subcategory-btn{border-color:#86d7d0;color:#087e77}
#topicNav[data-section="Statistics"] .subcategory-btn:hover,
#topicNav[data-section="Statistics"] .subcategory-btn.active{background:#13a89e;color:white}

#topicNav[data-section="Mechanics"]{background:#fff2ea;border-left-color:#e06f2a}
#topicNav[data-section="Mechanics"] .subcategory-btn{border-color:#efb38e;color:#b95518}
#topicNav[data-section="Mechanics"] .subcategory-btn:hover,
#topicNav[data-section="Mechanics"] .subcategory-btn.active{background:#e06f2a;color:white}

</style>
</head>

<script>
const SHEET_ID = "1oW4CNDfopfds2jo0k_exTAsGXoEwaxGeKGIxcP6ORWo";
const SHEET_GID = "0";

let allResources = [];
let currentLevel = "GCSE";
let currentSection = "All";
let currentSubcategory = "All";
let currentGrade = "All";
let sheetLoaded = false;

const SECTION_CONFIG = {
  "GCSE": ["Number", "Algebra", "Shape", "Data"],
  "A-Level": ["Pure", "Statistics", "Mechanics"]
};

const body = document.getElementById("resourceBody");
const searchInput = document.getElementById("searchInput");
const gradeButtons = document.getElementById("gradeButtons");
const status = document.getElementById("status");
const emptyMessage = document.getElementById("emptyMessage");
const errorBox = document.getElementById("errorBox");
const mainSections = document.getElementById("mainSections");
const gradeArea = document.getElementById("gradeArea");
const topicNav = document.getElementById("topicNav");
const topicNavLabel = document.getElementById("topicNavLabel");
const topicButtons = document.getElementById("topicButtons");

function clean(s){
  return String(s ?? "").trim().toLowerCase();
}

function escapeHTML(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeUrl(url){
  try{
    const raw = String(url || "").trim();
    const u = new URL(raw);
    if(!["http:","https:"].includes(u.protocol)) return "";

    const driveMatch = raw.match(/drive\.google\.com\/file\/d\/([^/]+)/i);
    if(driveMatch){
      return `https://drive.google.com/file/d/${driveMatch[1]}/view`;
    }

    if(u.hostname.includes("drive.google.com") && u.searchParams.get("id")){
      return `https://drive.google.com/file/d/${u.searchParams.get("id")}/view`;
    }

    return u.href;
  }catch{
    return "";
  }
}

function isVisibleValue(v){
  return ["yes","y","true","1","visible"].includes(clean(v));
}

/*
  IMPORTANT:
  We deliberately DO NOT use fetch() here.

  Google Sheets returns JavaScript that calls:
  google.visualization.Query.setResponse(...)

  Loading it as a <script> works when this page is opened locally
  and when it is later hosted as a normal website.
*/
window.google = window.google || {};
google.visualization = google.visualization || {};
google.visualization.Query = google.visualization.Query || {};

google.visualization.Query.setResponse = function(response){
  sheetLoaded = true;

  try{
    if(!response || response.status === "error"){
      throw new Error("Google returned an error.");
    }

    const table = response.table;
    if(!table || !table.cols || !table.rows){
      throw new Error("No table data was returned.");
    }

    const headers = table.cols.map(col => clean(col.label));

    function valueAt(row, headerName){
      const index = headers.indexOf(clean(headerName));
      if(index < 0) return "";
      const cell = row.c[index];
      if(!cell) return "";

      // Use formatted value when available, otherwise raw value.
      if(cell.f !== undefined && cell.f !== null) return String(cell.f);
      if(cell.v !== undefined && cell.v !== null) return String(cell.v);
      return "";
    }

    allResources = table.rows.map(row => ({
      order: Number(valueAt(row,"Order")) || 999999,
      level: valueAt(row,"Level"),
      section: valueAt(row,"Section"),
      topic: valueAt(row,"Topic"),
      resourceName: valueAt(row,"Resource Name"),
      worksheetLink: valueAt(row,"Worksheet Link"),
      answersLink: valueAt(row,"Answers Link"),
      grade: valueAt(row,"Grade"),
      keywords: valueAt(row,"Keywords"),
      visible: valueAt(row,"Visible")
    }))
    .filter(r => isVisibleValue(r.visible))
    .sort((a,b) => a.order - b.order);

    status.textContent =
      `${allResources.length} visible resource${allResources.length === 1 ? "" : "s"} loaded.`;

    errorBox.classList.add("hidden");
    buildGradeButtons();
    buildSectionButtons();
    buildTopicButtons();
    render();

  }catch(err){
    showLoadError();
    console.error(err);
  }
};

function showLoadError(){
  status.textContent = "";
  errorBox.classList.remove("hidden");
  errorBox.innerHTML = `
    <strong>Could not read the Google Sheet.</strong><br>
    Your sharing setting is correct. If this still appears, the most likely issue is that
    the first sheet tab is not using GID 0. Open the Google Sheet and look at the end of its
    address for <b>#gid=...</b>.
  `;
}

function loadGoogleSheet(){
  const script = document.createElement("script");

  script.src =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
    `?gid=${SHEET_GID}` +
    `&headers=1` +
    `&tqx=out:json`;

  script.onerror = showLoadError;
  document.head.appendChild(script);

  setTimeout(()=>{
    if(!sheetLoaded) showLoadError();
  },8000);
}

function buildGradeButtons(){
  gradeButtons.innerHTML = "";
  gradeArea.classList.toggle("hidden", currentLevel === "A-Level");

  const all = document.createElement("button");
  all.className = "grade-btn active";
  all.textContent = "All";
  all.dataset.grade = "All";
  gradeButtons.appendChild(all);

  const grades = [...new Set(
    allResources
      .filter(r => clean(r.level) === clean(currentLevel))
      .map(r => r.grade)
      .filter(Boolean)
  )];

  grades.sort((a,b)=>{
    const na = Number(a), nb = Number(b);
    if(!isNaN(na) && !isNaN(nb)) return nb-na;
    return String(a).localeCompare(String(b));
  });

  grades.forEach(g=>{
    const btn = document.createElement("button");
    btn.className = "grade-btn";
    btn.textContent = g;
    btn.dataset.grade = g;
    gradeButtons.appendChild(btn);
  });

  gradeButtons.querySelectorAll(".grade-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentGrade = btn.dataset.grade;

      gradeButtons.querySelectorAll(".grade-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");
      render();
    });
  });
}

function buildSectionButtons(){
  mainSections.innerHTML = "";

  const sections = SECTION_CONFIG[currentLevel] || [];

  const allBtn = document.createElement("button");
  allBtn.className = "section-btn" + (currentSection === "All" ? " active" : "");
  allBtn.dataset.section = "All";
  allBtn.textContent = "ALL";
  mainSections.appendChild(allBtn);

  sections.forEach(section => {
    const btn = document.createElement("button");
    btn.className = "section-btn" + (clean(currentSection) === clean(section) ? " active" : "");
    btn.dataset.section = section;
    btn.textContent = section.toUpperCase();
    mainSections.appendChild(btn);
  });

  mainSections.querySelectorAll(".section-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSection = btn.dataset.section;
      currentSubcategory = "All";

      buildSectionButtons();
      buildTopicButtons();
      render();
    });
  });
}

function buildTopicButtons(){
  topicButtons.innerHTML = "";

  if(currentSection === "All"){
    topicNav.classList.add("hidden");
    return;
  }

  // allResources is already sorted by the Order column, so topics appear
  // in the order they first appear in your Google Sheet.
  const topics = [];
  const seen = new Set();

  allResources
    .filter(r => clean(r.level) === clean(currentLevel) && clean(r.section) === clean(currentSection))
    .forEach(r => {
      const topic = String(r.topic || "").trim();
      const key = clean(topic);
      if(topic && !seen.has(key)){
        seen.add(key);
        topics.push(topic);
      }
    });

  if(topics.length === 0){
    topicNav.classList.add("hidden");
    return;
  }

  topicNav.classList.remove("hidden");
  topicNav.dataset.section = currentSection;
  topicNavLabel.textContent = currentSection + ":";

  const allBtn = document.createElement("button");
  allBtn.className = "subcategory-btn" + (currentSubcategory === "All" ? " active" : "");
  allBtn.dataset.subcategory = "All";
  allBtn.textContent = "ALL " + currentSection.toUpperCase();
  topicButtons.appendChild(allBtn);

  topics.forEach(topic => {
    const btn = document.createElement("button");
    btn.className = "subcategory-btn" + (clean(currentSubcategory) === clean(topic) ? " active" : "");
    btn.dataset.subcategory = topic;
    btn.textContent = topic.toUpperCase();
    topicButtons.appendChild(btn);
  });

  topicButtons.querySelectorAll(".subcategory-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubcategory = btn.dataset.subcategory;
      buildTopicButtons();
      render();
    });
  });
}

function render(){
  const q = clean(searchInput.value);

  const rows = allResources.filter(r=>{
    const levelOK = clean(r.level) === clean(currentLevel);

    const sectionOK =
      currentSection === "All" ||
      clean(r.section) === clean(currentSection);

    const subcategoryOK =
      currentSection === "All" ||
      currentSubcategory === "All" ||
      clean(r.topic) === clean(currentSubcategory);

    const gradeOK =
      currentGrade === "All" ||
      clean(r.grade) === clean(currentGrade);

    const haystack = clean([
      r.section,
      r.topic,
      r.resourceName,
      r.grade,
      r.keywords
    ].join(" "));

    const searchOK = !q || haystack.includes(q);

    return levelOK && sectionOK && subcategoryOK && gradeOK && searchOK;
  });

  body.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    const worksheet = safeUrl(r.worksheetLink);
    const answers = safeUrl(r.answersLink);

    tr.innerHTML = `
      <td class="topic">${escapeHTML(r.topic)}</td>
      <td class="resource-name">${escapeHTML(r.resourceName)}</td>

      <td>
        ${worksheet
          ? `<a class="pdf-link" href="${escapeHTML(worksheet)}"
               target="_blank" rel="noopener noreferrer">📄 PDF</a>`
          : `<span style="color:#9aa3a7">—</span>`}
      </td>

      <td>
        ${answers
          ? `<a class="pdf-link answer-link" href="${escapeHTML(answers)}"
               target="_blank" rel="noopener noreferrer">✓ Answers</a>`
          : `<span style="color:#9aa3a7">—</span>`}
      </td>

      <td>
        ${r.grade
          ? `<span class="grade-pill">${escapeHTML(r.grade)}</span>`
          : ""}
      </td>
    `;

    body.appendChild(tr);
  });

  emptyMessage.classList.toggle("hidden", rows.length !== 0);
}

document.querySelectorAll(".level-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentLevel = btn.dataset.level;
    currentSection = "All";
    currentSubcategory = "All";
    currentGrade = "All";

    document.querySelectorAll(".level-btn")
      .forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    topicNav.classList.add("hidden");
    topicButtons.innerHTML = "";

    buildGradeButtons();
    buildSectionButtons();
    buildTopicButtons();
    render();
  });
});


searchInput.addEventListener("input", render);

buildSectionButtons();
buildGradeButtons();
loadGoogleSheet();
</script>

</body>
</html>
