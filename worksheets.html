<script>
const SHEET_ID = "1oW4CNDfopfds2jo0k_exTAsGXoEwaxGeKGIxcP6ORWo";
const SHEET_GID = "0";

let allResources = [];
let currentLevel = "GCSE";
let currentSection = "All";
let currentSubcategory = "All";
let currentGrade = "All";
let sheetLoaded = false;

const SECTION_CONFIG = {
  "GCSE": [
    "Number",
    "Algebra",
    "Ratio, Proportion and Rates of Change",
    "Geometry and Measures",
    "Probability",
    "Statistics"
  ],
  "A-Level Maths": ["Pure", "Statistics", "Mechanics"],
  "A-Level Further Maths": ["Pure", "Numerical Methods"]
};

const TOPIC_ORDER = {
  "Number": [
    "Fractions, decimals and percentages",
    "Negative numbers",
    "Powers, roots and standard form",
    "Factors, multiples, primes",
    "Bounds and estimation"
  ],
  "Algebra": [
    "Simplifying and expanding",

    "Sequences",

    "Quadratics",
    "Simultaneous equations"
  ],
  "Ratio, Proportion and Rates of Change": [
    "Ratio",
    "Direct and inverse proportion",
    "Percentage change",
    "Compound interest",
    "Speed, density and pressure",
    "Growth and decay"
  ],
  "Geometry and Measures": [
    "Angles",
    "Properties of shapes",
    "Area, perimeter and volume",
    "Pythagoras",
    "Trigonometry",
    "Transformations",
    "Bearings",
    "Circles",
    "Similarity and congruence",
    "Vectors"
  ],
  "Probability": [
    "Basic probability",
    "Sample spaces",
    "Tree diagrams",
    "Venn diagrams",
    "Conditional probability",
    "Expected frequency"
  ],
  "Statistics": [
    "Averages and range",
    "Tables and charts",
    "Scatter graphs",
    "Cumulative frequency",
    "Box plots",
    "Histograms",
    "Sampling"
  ]
};

const body = document.getElementById("resourceBody");
const searchInput = document.getElementById("searchInput");
const gradeButtons = document.getElementById("gradeButtons");
const status = document.getElementById("status");
const emptyMessage = document.getElementById("emptyMessage");
const errorBox = document.getElementById("errorBox");
const mainSections = document.getElementById("mainSections");
const gradeArea = document.getElementById("gradeArea");
const topicNav = document.getElementById("topicNav");
const topicNavLabel = document.getElementById("topicNavLabel");
const topicButtons = document.getElementById("topicButtons");

function clean(s){
  return String(s ?? "").trim().toLowerCase();
}

function levelMatches(resourceLevel){
  const r = clean(resourceLevel);
  const current = clean(currentLevel);

  if(current === "a-level maths"){
    return r === "a-level maths" || r === "a-level";
  }

  return r === current;
}

function sectionMatches(resourceSection, selectedSection){
  if(selectedSection === "All") return true;

  const aliases = {
    "Geometry and Measures": ["Geometry and Measures", "Shape"],
    "Statistics": ["Statistics", "Data"]
  };

  const allowed = aliases[selectedSection] || [selectedSection];
  return allowed.some(section => clean(resourceSection) === clean(section));
}

function escapeHTML(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeUrl(url){
  try{
    const raw = String(url || "").trim();
    const u = new URL(raw);
    if(!["http:","https:"].includes(u.protocol)) return "";

    const driveMatch = raw.match(/drive\.google\.com\/file\/d\/([^/]+)/i);
    if(driveMatch){
      return `https://drive.google.com/file/d/${driveMatch[1]}/view`;
    }

    if(u.hostname.includes("drive.google.com") && u.searchParams.get("id")){
      return `https://drive.google.com/file/d/${u.searchParams.get("id")}/view`;
    }

    return u.href;
  }catch{
    return "";
  }
}

function isVisibleValue(v){
  return ["yes","y","true","1","visible"].includes(clean(v));
}

/*
  IMPORTANT:
  We deliberately DO NOT use fetch() here.

  Google Sheets returns JavaScript that calls:
  google.visualization.Query.setResponse(...)

  Loading it as a <script> works when this page is opened locally
  and when it is later hosted as a normal website.
*/
window.google = window.google || {};
google.visualization = google.visualization || {};
google.visualization.Query = google.visualization.Query || {};

google.visualization.Query.setResponse = function(response){
  sheetLoaded = true;

  try{
    if(!response || response.status === "error"){
      throw new Error("Google returned an error.");
    }

    const table = response.table;
    if(!table || !table.cols || !table.rows){
      throw new Error("No table data was returned.");
    }

    const headers = table.cols.map(col => clean(col.label));

    function valueAt(row, headerName){
      const index = headers.indexOf(clean(headerName));
      if(index < 0) return "";
      const cell = row.c[index];
      if(!cell) return "";

      // Use formatted value when available, otherwise raw value.
      if(cell.f !== undefined && cell.f !== null) return String(cell.f);
      if(cell.v !== undefined && cell.v !== null) return String(cell.v);
      return "";
    }

    allResources = table.rows.map(row => ({
      order: Number(valueAt(row,"Order")) || 999999,
      level: valueAt(row,"Level"),
      section: valueAt(row,"Section"),
      topic: valueAt(row,"Topic"),
      resourceName: valueAt(row,"Resource Name"),
      worksheetLink: valueAt(row,"Worksheet Link"),
      answersLink: valueAt(row,"Answers Link"),
      examplesLink: valueAt(row,"Example Link") || valueAt(row,"Examples Link"),
      grade: valueAt(row,"Grade"),
      keywords: valueAt(row,"Keywords"),
      visible: valueAt(row,"Visible")
    }))
    .filter(r => isVisibleValue(r.visible))
    .sort((a,b) => a.order - b.order);

    status.textContent =
      `${allResources.length} visible resource${allResources.length === 1 ? "" : "s"} loaded.`;

    errorBox.classList.add("hidden");
    buildGradeButtons();
    buildSectionButtons();
    buildTopicButtons();
    render();

  }catch(err){
    showLoadError();
    console.error(err);
  }
};

function showLoadError(){
  status.textContent = "";
  errorBox.classList.remove("hidden");
  errorBox.innerHTML = `
    <strong>Could not read the Google Sheet.</strong><br>
    Your sharing setting is correct. If this still appears, the most likely issue is that
    the first sheet tab is not using GID 0. Open the Google Sheet and look at the end of its
    address for <b>#gid=...</b>.
  `;
}

function loadGoogleSheet(){
  const script = document.createElement("script");

  script.src =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
    `?gid=${SHEET_GID}` +
    `&headers=1` +
    `&tqx=out:json`;

  script.onerror = showLoadError;
  document.head.appendChild(script);

  setTimeout(()=>{
    if(!sheetLoaded) showLoadError();
  },8000);
}

function buildGradeButtons(){
  gradeButtons.innerHTML = "";
  gradeArea.classList.toggle("hidden", currentLevel !== "GCSE");

  const all = document.createElement("button");
  all.className = "grade-btn active";
  all.textContent = "All";
  all.dataset.grade = "All";
  gradeButtons.appendChild(all);

  const grades = [...new Set(
    allResources
      .filter(r => levelMatches(r.level))
      .map(r => r.grade)
      .filter(Boolean)
  )];

  grades.sort((a,b)=>{
    const na = Number(a), nb = Number(b);
    if(!isNaN(na) && !isNaN(nb)) return nb-na;
    return String(a).localeCompare(String(b));
  });

  grades.forEach(g=>{
    const btn = document.createElement("button");
    btn.className = "grade-btn";
    btn.textContent = g;
    btn.dataset.grade = g;
    gradeButtons.appendChild(btn);
  });

  gradeButtons.querySelectorAll(".grade-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentGrade = btn.dataset.grade;

      gradeButtons.querySelectorAll(".grade-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");
      render();
    });
  });
}

function buildSectionButtons(){
  mainSections.innerHTML = "";

  const sections = SECTION_CONFIG[currentLevel] || [];
  const levelResources = allResources.filter(r => levelMatches(r.level));

  const allBtn = document.createElement("button");
  allBtn.className = "section-btn" + (currentSection === "All" ? " active" : "");
  allBtn.dataset.section = "All";
  allBtn.innerHTML = `ALL <span class="count-pill">${levelResources.length}</span>`;
  mainSections.appendChild(allBtn);

  sections.forEach(section => {
    const count = levelResources.filter(r => sectionMatches(r.section, section)).length;

    const btn = document.createElement("button");
    btn.className = "section-btn" + (clean(currentSection) === clean(section) ? " active" : "");
    btn.dataset.section = section;
    btn.innerHTML = `${section.toUpperCase()} <span class="count-pill">${count}</span>`;
    mainSections.appendChild(btn);
  });

  mainSections.querySelectorAll(".section-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSection = btn.dataset.section;
      currentSubcategory = "All";

      buildSectionButtons();
      buildTopicButtons();
      render();
    });
  });
}

function buildTopicButtons(){
  topicButtons.innerHTML = "";

  if(currentSection === "All"){
    topicNav.classList.add("hidden");
    return;
  }

  const topics = [];
  const seen = new Set();

  allResources
    .filter(r => levelMatches(r.level) && sectionMatches(r.section, currentSection))
    .forEach(r => {
      const topic = String(r.topic || "").trim();
      const key = clean(topic);
      if(topic && !seen.has(key)){
        seen.add(key);
        topics.push(topic);
      }
    });

  // Put the standard GCSE subtopics in the preferred order.
  // Any extra topics added to Google Sheets still appear afterwards.
  const preferred = TOPIC_ORDER[currentSection] || [];
  topics.sort((a,b) => {
    const ai = preferred.findIndex(x => clean(x) === clean(a));
    const bi = preferred.findIndex(x => clean(x) === clean(b));

    if(ai !== -1 && bi !== -1) return ai - bi;
    if(ai !== -1) return -1;
    if(bi !== -1) return 1;
    return a.localeCompare(b);
  });

  if(topics.length === 0){
    topicNav.classList.add("hidden");
    return;
  }

  topicNav.classList.remove("hidden");
  topicNav.dataset.section = currentSection;
  topicNavLabel.textContent = currentSection + ":";

  const sectionResources = allResources.filter(
    r => levelMatches(r.level) && sectionMatches(r.section, currentSection)
  );

  const allBtn = document.createElement("button");
  allBtn.className = "subcategory-btn" + (currentSubcategory === "All" ? " active" : "");
  allBtn.dataset.subcategory = "All";
  allBtn.innerHTML = `ALL ${currentSection.toUpperCase()} <span class="count-pill">${sectionResources.length}</span>`;
  topicButtons.appendChild(allBtn);

  topics.forEach(topic => {
    const count = sectionResources.filter(r => clean(r.topic) === clean(topic)).length;

    const btn = document.createElement("button");
    btn.className = "subcategory-btn" + (clean(currentSubcategory) === clean(topic) ? " active" : "");
    btn.dataset.subcategory = topic;
    btn.innerHTML = `${topic.toUpperCase()} <span class="count-pill">${count}</span>`;
    topicButtons.appendChild(btn);
  });

  topicButtons.querySelectorAll(".subcategory-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubcategory = btn.dataset.subcategory;
      buildTopicButtons();
      render();
    });
  });
}

function render(){
  const q = clean(searchInput.value);

  const rows = allResources.filter(r=>{
    const levelOK = levelMatches(r.level);

    const sectionOK = sectionMatches(r.section, currentSection);

    const subcategoryOK =
      currentSection === "All" ||
      currentSubcategory === "All" ||
      clean(r.topic) === clean(currentSubcategory);

    const gradeOK =
      currentGrade === "All" ||
      clean(r.grade) === clean(currentGrade);

    const haystack = clean([
      r.section,
      r.topic,
      r.resourceName,
      r.grade,
      r.keywords
    ].join(" "));

    const searchOK = !q || haystack.includes(q);

    return levelOK && sectionOK && subcategoryOK && gradeOK && searchOK;
  });

  body.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    const worksheet = safeUrl(r.worksheetLink);
    const answers = safeUrl(r.answersLink);
    const examples = safeUrl(r.examplesLink);

    tr.innerHTML = `
      <td class="topic">${escapeHTML(r.topic)}</td>
      <td class="resource-name">${escapeHTML(r.resourceName)}</td>

      <td>
        ${worksheet
          ? `<a class="pdf-link" href="${escapeHTML(worksheet)}"
               target="_blank" rel="noopener noreferrer">📄 PDF</a>`
          : `<span style="color:#9aa3a7">—</span>`}
      </td>

      <td>
        ${answers
          ? `<a class="pdf-link answer-link" href="${escapeHTML(answers)}"
               target="_blank" rel="noopener noreferrer">✓ Answers</a>`
          : `<span style="color:#9aa3a7">—</span>`}
      </td>

      <td>
        ${examples
          ? `<a class="pdf-link example-link" href="${escapeHTML(examples)}"
               target="_blank" rel="noopener noreferrer">★ Examples</a>`
          : `<span style="color:#9aa3a7">—</span>`}
      </td>

      <td>
        ${r.grade
          ? `<span class="grade-pill">${escapeHTML(r.grade)}</span>`
          : ""}
      </td>
    `;

    body.appendChild(tr);
  });

  status.textContent = `${rows.length} resource${rows.length === 1 ? "" : "s"}`;
  emptyMessage.classList.toggle("hidden", rows.length !== 0);
}

document.querySelectorAll(".level-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentLevel = btn.dataset.level;
    currentSection = "All";
    currentSubcategory = "All";
    currentGrade = "All";

    document.querySelectorAll(".level-btn")
      .forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    topicNav.classList.add("hidden");
    topicButtons.innerHTML = "";

    buildGradeButtons();
    buildSectionButtons();
    buildTopicButtons();
    render();
  });
});


searchInput.addEventListener("input", render);

buildSectionButtons();
buildGradeButtons();
loadGoogleSheet();
</script>

</body>
</html>
